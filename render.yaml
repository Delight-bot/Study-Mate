databases:
  - name: studeymate-db
    databaseName: studeymate
    user: studeymate
    plan: free

services:
  # --- Qdrant (vector store used by notes-agent) ---
  - type: web
    name: studeymate-qdrant
    runtime: image
    plan: free
    image:
      url: docker.io/qdrant/qdrant:latest
    envVars:
      - key: QDRANT__SERVICE__HTTP_PORT
        value: 6333

  # --- LLM Performance Router (main backend) ---
  - type: web
    name: studeymate-llm-router
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    envVars:
      - key: POSTGRES_HOST
        fromDatabase: { name: studeymate-db, property: host }
      - key: POSTGRES_PORT
        fromDatabase: { name: studeymate-db, property: port }
      - key: POSTGRES_USER
        fromDatabase: { name: studeymate-db, property: user }
      - key: POSTGRES_PASSWORD
        fromDatabase: { name: studeymate-db, property: password }
      - key: POSTGRES_DB
        fromDatabase: { name: studeymate-db, property: database }
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: LLAMA_API_KEY
        sync: false

  # --- Quiz agent ---
  - type: web
    name: studeymate-quiz-agent
    runtime: docker
    plan: free
    dockerfilePath: services/quiz-agent/Dockerfile
    dockerContext: services/quiz-agent
    envVars:
      - key: POSTGRES_HOST
        fromDatabase: { name: studeymate-db, property: host }
      - key: POSTGRES_PORT
        fromDatabase: { name: studeymate-db, property: port }
      - key: POSTGRES_USER
        fromDatabase: { name: studeymate-db, property: user }
      - key: POSTGRES_PASSWORD
        fromDatabase: { name: studeymate-db, property: password }
      - key: POSTGRES_DB
        fromDatabase: { name: studeymate-db, property: database }
      - key: OPENAI_API_KEY
        sync: false

  # --- Flashcard agent ---
  - type: web
    name: studeymate-flashcard-agent
    runtime: docker
    plan: free
    dockerfilePath: services/flashcard-agent/Dockerfile
    dockerContext: services/flashcard-agent
    envVars:
      - key: POSTGRES_HOST
        fromDatabase: { name: studeymate-db, property: host }
      - key: POSTGRES_PORT
        fromDatabase: { name: studeymate-db, property: port }
      - key: POSTGRES_USER
        fromDatabase: { name: studeymate-db, property: user }
      - key: POSTGRES_PASSWORD
        fromDatabase: { name: studeymate-db, property: password }
      - key: POSTGRES_DB
        fromDatabase: { name: studeymate-db, property: database }
      - key: OPENAI_API_KEY
        sync: false

  # --- Notes agent (uses Qdrant for embeddings search) ---
  - type: web
    name: studeymate-notes-agent
    runtime: docker
    plan: free
    dockerfilePath: services/notes-agent/Dockerfile
    dockerContext: services/notes-agent
    envVars:
      - key: POSTGRES_HOST
        fromDatabase: { name: studeymate-db, property: host }
      - key: POSTGRES_PORT
        fromDatabase: { name: studeymate-db, property: port }
      - key: POSTGRES_USER
        fromDatabase: { name: studeymate-db, property: user }
      - key: POSTGRES_PASSWORD
        fromDatabase: { name: studeymate-db, property: password }
      - key: POSTGRES_DB
        fromDatabase: { name: studeymate-db, property: database }
      # fromService's private-network linking wasn't reachable on the free
      # plan (or wasn't wired the way we expected), so use the service's
      # actual public URL instead — confirmed to match this exact pattern
      # by the gateway's own URL after deploy.
      - key: QDRANT_URL
        value: https://studeymate-qdrant.onrender.com
      - key: OPENAI_API_KEY
        sync: false

  # --- Gateway (the one public entry point; frontend talks to this) ---
  - type: web
    name: studeymate-gateway
    runtime: docker
    plan: free
    dockerfilePath: gateway/Dockerfile
    dockerContext: gateway
    envVars:
      # See the QDRANT_URL comment above re: why these are literal public
      # URLs rather than fromService links.
      - key: LLM_ROUTER_URL
        value: https://studeymate-llm-router.onrender.com
      - key: QUIZ_AGENT_URL
        value: https://studeymate-quiz-agent.onrender.com
      - key: FLASHCARD_AGENT_URL
        value: https://studeymate-flashcard-agent.onrender.com
      - key: NOTES_AGENT_URL
        value: https://studeymate-notes-agent.onrender.com
