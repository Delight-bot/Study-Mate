apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-router
  namespace: studeymate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-router
  template:
    metadata:
      labels:
        app: llm-router
    spec:
      containers:
        - name: llm-router
          image: studeymate/llm-router:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_DB
              value: "llm_router"
          envFrom:
            - configMapRef:
                name: studeymate-config
            - secretRef:
                name: studeymate-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: llm-router
  namespace: studeymate
spec:
  selector:
    app: llm-router
  ports:
    - port: 8000
      targetPort: 8000
